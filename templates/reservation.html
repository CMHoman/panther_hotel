{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
	<div class="col-md-6">
		<div class="card p-4 mt-3">
			<h3 class="mb-3 row">Panther Hotel Room Reservations</h3>
			<form method="POST">
				<div class="mb-3 row">
					<label class="col-sm-4 col-form-label text-end">Name:</label>
					<div class="col-sm-8">
						<input type="text" class="form-control" name="guest_name" required>
					</div>
				</div>
				<div class="mb-3 row">
					<label class="col-sm-4 col-form-label text-end">Check-in date:</label>
					<div class="col-sm-8">
						<input type="date" class="form-control" name="check_in" required>
					</div>
				</div>
				<div class="mb-3 row">
					<label class="col-sm-4 col-form-label text-end">Check-out date:</label>
					<div class="col-sm-8">
						<input type="date" class="form-control" name="check_out" required>
					</div>
				</div>
				<div class="mb-4 row">
					<label class="col-sm-4 col-form-label text-end">Room Type:</label>
					<div class="col-sm-8">
						<select class="form-select" name="room_type" required>
							<option value="">-- Select --</option>
							<option value="Single">Single</option>
							<option value="Double">Double</option>
							<option value="Suite">Suite</option>
						</select>
					</div>
				</div>
				<div class="text-center">
					<button type="submit" class="btn btn-primary px-5">Submit</button>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %}
